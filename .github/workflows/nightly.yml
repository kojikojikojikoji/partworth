name: nightly
permissions:
  contents: read
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"
      - run: uv run --no-sync pytest -q --run-slow --run-network
